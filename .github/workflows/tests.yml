name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            db_database: ':memory:'
          - database: pgsql
            db_database: docqa

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: docqa
          POSTGRES_USER: docqa
          POSTGRES_PASSWORD: docqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docqa -d docqa"
          --health-interval 5s
          --health-retries 10

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.db_database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: docqa
      DB_PASSWORD: docqa

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, zip, xml, dom, fileinfo, gd, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Retrieval evaluation
        env:
          EMBEDDING_PROVIDER: hash
          DB_DATABASE: ${{ matrix.database == 'sqlite' && 'database/eval.sqlite' || 'docqa' }}
        run: |
          if [ "$DB_CONNECTION" = sqlite ]; then touch database/eval.sqlite; fi
          php artisan migrate:fresh --force
          php artisan rag:eval --misses
          php artisan rag:eval --set=resources/eval/holdout.json --misses
